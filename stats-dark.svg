<svg xmlns="http://www.w3.org/2000/svg" width="940" height="104" viewBox="0 0 940 104" role="img" aria-label="Contributions, past year: 1,109. Current streak: 5 days. Longest streak: 12 days. Public repositories: 5. Followers: 5">
  <title>GitHub activity at a glance</title>
  <style>
    .num { font: 600 26px Georgia, 'Times New Roman', serif; fill: #f5b56b; }
    .lbl { font: 500 9.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #b08a63; letter-spacing: .12em; text-transform: uppercase; }
    .tile { opacity: 0; animation: pop 620ms cubic-bezier(.22,.61,.36,1) forwards; }
    @keyframes pop { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { .tile { animation: none; opacity: 1; } }
  </style>
  <g class="tile" style="animation-delay:0ms">
    <rect x="0.0" y="0" width="176.8" height="104" rx="10" fill="#231708" stroke="#3a2612"/>
    <text x="88.4" y="47" class="num" text-anchor="middle">1,109</text>
    <text x="88.4" y="70" class="lbl" text-anchor="middle">Contributions, past year</text>
  </g>
  <g class="tile" style="animation-delay:120ms">
    <rect x="190.8" y="0" width="176.8" height="104" rx="10" fill="#231708" stroke="#3a2612"/>
    <text x="279.2" y="47" class="num" text-anchor="middle">5 days</text>
    <text x="279.2" y="70" class="lbl" text-anchor="middle">Current streak</text>
  </g>
  <g class="tile" style="animation-delay:240ms">
    <rect x="381.6" y="0" width="176.8" height="104" rx="10" fill="#231708" stroke="#3a2612"/>
    <text x="470.0" y="47" class="num" text-anchor="middle">12 days</text>
    <text x="470.0" y="70" class="lbl" text-anchor="middle">Longest streak</text>
  </g>
  <g class="tile" style="animation-delay:360ms">
    <rect x="572.4" y="0" width="176.8" height="104" rx="10" fill="#231708" stroke="#3a2612"/>
    <text x="660.8" y="47" class="num" text-anchor="middle">5</text>
    <text x="660.8" y="70" class="lbl" text-anchor="middle">Public repositories</text>
  </g>
  <g class="tile" style="animation-delay:480ms">
    <rect x="763.2" y="0" width="176.8" height="104" rx="10" fill="#231708" stroke="#3a2612"/>
    <text x="851.6" y="47" class="num" text-anchor="middle">5</text>
    <text x="851.6" y="70" class="lbl" text-anchor="middle">Followers</text>
  </g>
</svg>
