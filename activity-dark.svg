    @media (prefers-reduced-motion: reduce) {
      #wiperect, #line, #area, .peak, .head { animation: none; }
      #wiperect { width: 940px; }
      #line { stroke-dashoffset: 0; }
      #area, .peak, .head { opacity: 1; }
    }
