# Builds the README graphics and pushes them to the `output` branch.
name: Contribution graphics

on:
  schedule:
    # Monthly, on the 1st at 00:20 UTC.
    - cron: '20 0 1 * *'
  workflow_dispatch:
  push:
    branches: [main]

# Cancel an in-flight run when a newer one starts; only the latest matters.
concurrency:
  group: contribution-graphics
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Must run before snk, which creates `dist` as root otherwise.
      - name: Render the weekly chart and stats strip
        run: node .github/scripts/render-activity.mjs
        env:
          GITHUB_USER: ${{ github.repository_owner }}
          OUT_DIR: dist

      # A light and a dark version, to match the viewer's GitHub theme.
      - name: Generate the contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=%23ff7d5e&color_dots=%23efe8da,%23d7ccff,%23bda8ff,%235a63ff,%232b33c4
            dist/snake-dark.svg?color_snake=%23ffde4d&color_dots=%23232220,%233b3570,%235a3cc9,%235a63ff,%23bda8ff

      - name: List what will be published
        run: ls -l dist

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
