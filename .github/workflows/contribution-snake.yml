# Renders the contribution graph as an animated SVG (a snake eating the dots)
# and pushes it to the `output` branch, which the README reads from. Runs on a
# schedule so the animation stays current without touching `main`.
name: Contribution snake

on:
  schedule:
    # Daily at 00:20 UTC — after GitHub has settled the previous day's contributions.
    - cron: '20 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]

# Cancel an in-flight run when a newer one starts; only the latest matters.
concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Two variants, coloured with the site's own tokens (Theme.css), so the
      # README's <picture> can switch them with the viewer's GitHub theme.
      - name: Generate animated graph
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=%237a3e10&color_dots=%23f2e3c4,%23f5b56b,%23e07b1f,%23b8651c,%237a3e10
            dist/snake-dark.svg?color_snake=%23f5b56b&color_dots=%231c1208,%237a3e10,%23c47020,%23e89542,%23f5b56b

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
