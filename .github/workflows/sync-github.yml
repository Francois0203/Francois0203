name: Sync GitHub Projects to Firestore

on:
  # Run once a month on the 1st at 02:00 UTC
  schedule:
    - cron: '0 2 1 * *'
  # Run on every push to main
  push:
    branches: [main]
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install script dependencies
        run: npm install
        working-directory: scripts

      - name: Sync GitHub projects → Firestore
        run: node syncGitHubProjects.mjs
        working-directory: scripts
        env:
          GH_PAT:                   ${{ secrets.GH_PAT }}
          SERVICE_ACCOUNT: ${{ secrets.SERVICE_ACCOUNT }}

      # Discovers every repo in the studio org and resolves its live site(s).
      # Runs even if the step above failed: the two collections are independent,
      # and a broken personal-repo list should not blank the client work.
      - name: Sync studio sites → Firestore
        if: always()
        run: node syncStudioSites.mjs
        working-directory: scripts
        env:
          # A fine-grained token is scoped to ONE resource owner, so listing the
          # org needs its own token. Falls back to GH_PAT for a classic token
          # that covers both owners.
          GH_PAT:          ${{ secrets.STUDIO_PAT || secrets.GH_PAT }}
          SERVICE_ACCOUNT: ${{ secrets.SERVICE_ACCOUNT }}
          STUDIO_ORG:      FM-Web-Studio
          SITE_ORIGIN:     ${{ vars.SITE_ORIGIN }}
          PRUNE:           '1'
