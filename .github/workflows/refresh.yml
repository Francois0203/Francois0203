# Keeps the site data and the README graphics fresh. Two independent jobs in one workflow.
name: Refresh data and graphics

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 1 * *'
  workflow_dispatch:

# A newer run replaces one still in progress.
concurrency:
  group: refresh
  cancel-in-progress: true

jobs:
  sync:
    name: Sync projects to Firestore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install script dependencies
        run: npm install
        working-directory: scripts

      - name: Sync GitHub projects
        run: node syncGitHubProjects.mjs
        working-directory: scripts
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          SERVICE_ACCOUNT: ${{ secrets.SERVICE_ACCOUNT }}

      # Runs even if the step above failed, the two lists are independent.
      - name: Sync client sites
        if: always()
        run: node syncStudioSites.mjs
        working-directory: scripts
        env:
          GH_PAT: ${{ secrets.STUDIO_PAT || secrets.GH_PAT }}
          SERVICE_ACCOUNT: ${{ secrets.SERVICE_ACCOUNT }}
          STUDIO_ORG: FM-Web-Studio
          PRUNE: '1'

  graphics:
    name: Draw README graphics
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Must run before snk, which otherwise creates dist as root.
      - name: Render the weekly chart and stats strip
        run: node .github/scripts/render-activity.mjs
        env:
          GITHUB_USER: ${{ github.repository_owner }}
          OUT_DIR: dist

      - name: Draw the contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=%23ff7a4d&color_dots=%23eceef6,%23cdd2ff,%2394a0ff,%235b6cff,%232f3bd1
            dist/snake-dark.svg?color_snake=%23ffc63a&color_dots=%2312131c,%232a2f66,%233f4bb8,%235b6cff,%23a87bff

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
